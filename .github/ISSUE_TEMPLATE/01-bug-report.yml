name: "Bug report / 问题反馈"
description: "Report a problem with the CCMobile app / 反馈 CCMobile 应用的问题"
title: "[Bug]: "
labels: ["bug report"]
body:
  - type: markdown
    attributes:
      value: |
        **This is the bug tracker for the CCMobile app.** Problems with Claude Code itself (not caused by this app) belong at [anthropics/claude-code](https://github.com/anthropics/claude-code/issues).
        这里是 CCMobile 应用的问题反馈。与本应用无关的 Claude Code 本身的问题，请到 [anthropics/claude-code](https://github.com/anthropics/claude-code/issues) 反馈。

        Please search existing issues before opening a new one. / 提交前请先搜索是否已有相同问题。
  - type: textarea
    attributes:
      label: Problem description / 问题描述
      description: |
        A clear and concise description of the problem. Attach logs (e.g. the setup log), screenshots or a screen recording if they help.
        清晰描述问题，可附上日志（如安装日志）、截图或录屏。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce / 复现步骤
      description: |
        What you did, step by step, so the problem can be reproduced.
        请按步骤说明如何复现。
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior / 期望结果
  - type: textarea
    attributes:
      label: System information / 系统信息
      description: Please provide info about your device / 请提供设备信息
      value: |
        * CCMobile version / 版本:
        * APK architecture / 安装包架构 (arm64-v8a, x86_64, universal...):
        * Claude Code version / Claude Code 版本:
        * Login method / 登录方式 (Claude subscription / third-party API):
        * Android OS version / 安卓版本:
        * Device model / 设备型号 (or emulator / 模拟器):
    validations:
      required: true
